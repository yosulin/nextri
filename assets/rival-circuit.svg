    <line x1="30" y1="68" x2="50" y2="28" stroke="#2f7ef0" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="28" x2="70" y2="68" stroke="#2f7ef0" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="68" x2="70" y2="68" stroke="#2f7ef0" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="68" x2="82" y2="42" stroke="#2f7ef0" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7" opacity=".7"/>
    <circle cx="50" cy="28" r="9" fill="#2f7ef0"/>
    <circle cx="30" cy="68" r="9" fill="#2f7ef0"/>
    <circle cx="70" cy="68" r="9" fill="#2f7ef0"/>
    <circle cx="82" cy="42" r="5" fill="#2f7ef0" opacity=".6"/>
