function buildGameUI() {
  const panel = document.getElementById('topPanel');
  // Limpiar tarjetas anteriores (conservar el dado)
  const diceArea = panel.querySelector('.dice-area');
  panel.innerHTML = '';

  // Insertar tarjetas: mitad antes del dado, mitad después (o todas antes si 1-3)
  const half = Math.ceil(players.length / 2);
  players.forEach((p, i) => {
    const color = PLAYER_COLORS[p.colorIndex];
    const pClass = p.colorIndex === 0 ? 'p1' : p.colorIndex === 1 ? 'p2' : '';
    const card = document.createElement('div');
    card.className = `player-card`;
    card.id = `card${i+1}`;
    card.style.cssText = `color:${color};border-color:var(--border);`;
    card.innerHTML = `
      <span class="player-name" id="label${i+1}">${escapeHtml(p.name.toUpperCase())}</span>
      <span class="player-score" id="score${i+1}">0</span>
      <span class="player-initial" id="init${i+1}">${p.initial}</span>`;
    if (i === half) panel.appendChild(diceArea);
    panel.appendChild(card);
  });
  if (!panel.contains(diceArea)) panel.appendChild(diceArea);
}

// Inicializar setup al cargar
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('versionTag').textContent = APP_VERSION;
  document.getElementById('infoVersion').textContent = APP_VERSION;
  applyTheme(getInitialTheme());
  initPlayerCountSelector();
  setPlayerCount(2); // mínimo y default: 2 jugadores
});

// Responsive: redibujar si cambia el tamaño
// El resize/rotación YA NO toca circles/MAX_DIST/CIRCLE_R en absoluto —
// esos quedan congelados desde generateCircles() hasta la siguiente
// partida. Lo único que cambia aquí es cuánto ocupa VISUALMENTE el
// tablero en pantalla (el recuadro CSS), no sus coordenadas lógicas.
// boardPoint() ya convierte correctamente de tamaño CSS a coordenadas
// lógicas vía getBoundingClientRect(), así que un simple cambio de
// tamaño visual no descoloca los clics/arrastres.
function fitBoardDisplay() {
  if (!canvas || !W || !H) return;
  const wrap = canvas.parentElement;
  const availableWidth = document.documentElement.clientWidth - 16;
  const wrapTop = wrap.getBoundingClientRect().top;
  const availableHeight = window.innerHeight - wrapTop - 76; // mismo margen que boardDimensions()
  const scale = Math.min(availableWidth / W, Math.max(availableHeight, 160) / H, 1);
  wrap.style.width = `${Math.round(W * scale)}px`;
  wrap.style.height = `${Math.round(H * scale)}px`;
}
window.addEventListener('resize', fitBoardDisplay);
// Algunos navegadores móviles no disparan 'resize' de forma fiable al girar
// el dispositivo — 'orientationchange' es más consistente ahí. Un pequeño
// retraso porque innerHeight/innerWidth tardan un momento en actualizarse
// tras el giro en algunos navegadores.
window.addEventListener('orientationchange', () => setTimeout(fitBoardDisplay, 150));
</script>

<div id="installBanner">
  <div class="ib-icon">⬤</div>
  <div class="ib-text"><strong>Instalar app</strong><span>Juega sin conexión</span></div>
  <button class="ib-btn" id="installBtn">Instalar</button>
  <button class="ib-close" id="installClose">✕</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
let deferredPrompt = null;
const banner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');
const closeBtn = document.getElementById('installClose');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  setTimeout(() => banner.classList.add('show'), 1500);
});
installBtn.addEventListener('click', async () => {
  banner.classList.remove('show');
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
closeBtn.addEventListener('click', () => banner.classList.remove('show'));
window.addEventListener('appinstalled', () => { banner.classList.remove('show'); deferredPrompt = null; });
</script>
