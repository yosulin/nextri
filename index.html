<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Círculos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1f2e;
    --surface: #252b3b;
    --border: #343d54;
    --p1-color: #f4844a;
    --p2-color: #5b9cf6;
    --p1-light: rgba(244,132,74,0.25);
    --p2-light: rgba(91,156,246,0.25);
    --text: #e8eaf0;
    --muted: #8991af;
    --circle-r: 14;
  }

  [data-theme='light'] {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --border: #dcdfe8;
    --p1-color: #d9662a;
    --p2-color: #2f6fd6;
    --p1-light: rgba(217,102,42,0.15);
    --p2-light: rgba(47,111,214,0.15);
    --text: #1a1f2e;
    --muted: #6b7280;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px 72px;
    gap: 16px;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    letter-spacing: 1px;
    color: var(--text);
    text-align: center;
    transition: font-size .2s ease;
  }

  /* Cabecera compacta en cuanto empieza la partida — el título grande y la
     versión no aportan nada mientras juegas, y le quitan sitio al tablero
     justo cuando más falta hace. Aplica en cualquier orientación (la
     regla de horizontal de más abajo hacía algo parecido, pero solo ahí). */
  body.in-game h1 {
    font-size: 1.05rem;
    letter-spacing: .5px;
  }
  body.in-game #versionTag {
    display: none;
  }
  body.in-game {
    padding-top: 10px;
  }

  /* ── Panel superior ── */
  .top-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: nowrap;   /* SIEMPRE en una fila */
    width: 100%;
    max-width: 720px;
    grid-area: players;
  }

  /* ── Layout de la partida, apilado en vertical (el juego está bloqueado
     a esa orientación desde la v2.23) ── */
  #gameUI {
    display: none; /* .is-active lo activa — nunca lo pongas inline en JS,
                       un estilo inline gana siempre a esta regla */
    gap: 16px;
    width: 100%;
    max-width: 720px;
    grid-template-areas: "players" "actions" "board";
    grid-template-columns: 1fr;
    justify-items: center;
  }
  #gameUI.is-active { display: grid; }
  #gameUI .canvas-wrap { grid-area: board; }
  #gameUI > .game-actions-row { grid-area: actions; }

  /* ── Bloqueo de orientación: el juego se juega en vertical. La PWA
     instalada respeta esto vía manifest.json (orientation: portrait-primary);
     en pestaña normal del navegador no hay forma de forzarlo, así que este
     aviso cubre ese caso — la partida se queda tal cual está, no se toca
     ninguna coordenada, solo se oculta visualmente hasta que gires de
     vuelta. */
  .portrait-guard { display: none; }

  @media (orientation: landscape) and (any-pointer: coarse) {
    body.in-game .portrait-guard {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    body.in-game .portrait-guard .portrait-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    body.in-game .portrait-guard strong {
      display: block;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      margin-bottom: 6px;
    }
    body.in-game .portrait-guard p {
      color: var(--muted);
      margin: 0;
    }
    body.in-game #gameUI {
      visibility: hidden;
      pointer-events: none;
    }
  }

  .player-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: 1;             /* ocupa espacio disponible equitativamente */
    min-width: 0;        /* permite shrink */
    transition: border-color .3s, box-shadow .3s;
  }
  .player-card.active { box-shadow: 0 0 0 3px currentColor; }
  .player-card.p1 { color: var(--p1-color); }
  .player-card.p1.active { border-color: var(--p1-color); }
  .player-card.p2 { color: var(--p2-color); }
  .player-card.p2.active { border-color: var(--p2-color); }

  .player-name {
    font-weight: 700; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .player-score { font-family: 'Fredoka One', cursive; font-size: 1.8rem; line-height: 1; }
  .player-initial { font-size: .8rem; font-weight: 600; }

  /* ── Dado ── */
  .dice-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;      /* el dado no se encoge */
    width: 92px;          /* fijo: ancho para caber "Tira el dado" sin
                              reflotar las tarjetas de jugador cuando el
                              texto cambia a "N líneas" / "Sin líneas" */
  }

  .dice {
    width: 52px; height: 52px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 6px;
    gap: 3px;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    position: relative;
    font: inherit;
    margin: 0;
    appearance: none;
  }
  .dice:hover { border-color: var(--muted); transform: scale(1.05); }
  .dice.rolling { animation: shake .4s ease; }
  .dice:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
  }
  .dice:disabled:hover { border-color: var(--border); transform: none; }

  /* Invita a pulsar cuando está vacío esperando turno — solo si además
     está habilitado (no en el turno de Circuit, aunque ahí también esté
     vacío por otro motivo). prefers-reduced-motion ya lo apaga con la
     regla global del proyecto. */
  .dice.waiting:not(:disabled) {
    animation: dice-pulse 1.8s ease-in-out infinite;
  }
  @keyframes dice-pulse {
    0%, 100% { transform: scale(1); border-color: var(--border); }
    50% { transform: scale(1.06); border-color: var(--p1-color); }
  }

  @keyframes shake {
    0%,100% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-12deg) scale(1.08); }
    40% { transform: rotate(10deg) scale(1.08); }
    60% { transform: rotate(-8deg) scale(1.05); }
    80% { transform: rotate(6deg) scale(1.05); }
  }

  .dot {
    border-radius: 50%;
    background: var(--text);
    width: 100%; height: 100%;
    visibility: hidden;
  }
  /* posiciones de los puntos en la cuadrícula 3x3 */
  .dot.on { visibility: visible; }

  .dice-label {
    font-size: .7rem;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }
  .lines-left {
    font-family: 'Fredoka One', cursive;
    font-size: .95rem;
    color: var(--text);
    white-space: nowrap;
  }

  /* ── Turno info ── */
  .turn-info {
    position: fixed;
    bottom: 68px;
    left: 16px;
    right: 16px;
    z-index: 25;
    width: fit-content;
    max-width: calc(100% - 32px);
    margin: 0 auto;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: .85rem;
    color: var(--muted);
    text-align: center;
    box-shadow: 0 8px 20px -10px rgba(0,0,0,.35);
  }
  .turn-info span { font-weight: 700; }

  /* ── Canvas ── */
  .canvas-wrap {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    width: 100%;
    max-width: 960px;
    /* Sin aspect-ratio a propósito: el tablero no tiene por qué ser
       cuadrado — ancho y alto se fijan por separado en JS según lo que
       realmente quepa en pantalla, para no desperdiciar la dimensión más
       generosa. Ver boardDimensions(). */
    position: relative;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  /* ── Botón nuevo juego ── */
  .btn-new {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: .9rem;
    font-weight: 700;
    padding: 10px 24px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .btn-new:hover { border-color: var(--muted); background: var(--border); }
  .btn-new:disabled { opacity: .4; cursor: not-allowed; }
  .btn-new:disabled:hover { border-color: var(--border); background: var(--surface); }

  /* Barra de cuenta atrás dentro de "Deshacer" — se encoge en el mismo
     tiempo real que el margen antes de pasarle el turno a Circuit, no una
     animación aparte que pueda desincronizarse del JS. */
  #undoBtn { position: relative; overflow: hidden; }
  #undoBtn .countdown-fill {
    position: absolute;
    inset: 0;
    background: var(--p1-light, rgba(244,132,74,0.25));
    transform-origin: left;
    animation-name: countdown-shrink;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    pointer-events: none;
  }
  @keyframes countdown-shrink {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
  .game-actions-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    width: 100%;
  }
  .game-actions-row .btn-new { flex: 1; max-width: 220px; }

  /* ── Modal fin de juego ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 36px 48px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }
  .modal h2 { font-family: 'Fredoka One', cursive; font-size: 2rem; }
  .modal p { color: var(--muted); }
  .dialog-close-x {
    position: absolute;
    top: 10px; right: 10px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dialog-close-x:hover { background: var(--bg); color: var(--text); }

  #installBanner {
    display: none; position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #252b3b;
    border: 2px solid #5b9cf6; border-radius: 16px;
    padding: 14px 20px; z-index: 200; align-items: center;
    gap: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
    max-width: 320px; width: 90%;
  }
  #installBanner.show { display: flex; }
  #installBanner .ib-icon { font-size: 1.8rem; flex-shrink:0; }
  #installBanner .ib-text { flex:1; }
  #installBanner .ib-text strong { display:block; font-family:'Fredoka One',cursive; font-size:1rem; color:#e8eaf0; }
  #installBanner .ib-text span { font-size:.75rem; color:#7a82a0; }
  #installBanner .ib-btn { background: #5b9cf6; color: #1a1f2e; border: none; border-radius: 10px; padding: 8px 14px; font-family:'Nunito',sans-serif; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  #installBanner .ib-close { background:none; border:none; color:#7a82a0; font-size:1.1rem; cursor:pointer; padding:0; flex-shrink:0; }

  /* ── Setup Panel ── */
  .setup-box {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .setup-section { display: flex; flex-direction: column; gap: 10px; }
  .setup-label {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  /* Selector número de jugadores */
  .player-count-row {
    display: flex;
    gap: 8px;
  }
  .pc-btn {
    flex: 1;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 10px 4px;
    cursor: pointer;
    transition: all .2s;
    text-align: center;
    margin: 0;
    appearance: none;
  }
  .pc-btn.active {
    background: var(--surface);
    border-color: var(--p1-color);
    color: var(--p1-color);
  }
  /* Inputs de nombres */
  .names-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .name-input-wrap { position: relative; }
  .name-dot {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .setup-input {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: .85rem;
    padding: 9px 10px 9px 26px;
    outline: none;
    box-sizing: border-box;
    transition: border-color .2s;
  }
  .setup-input:focus { border-color: var(--muted); }
  /* Slider círculos */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row input[type=range] {
    flex: 1;
    accent-color: var(--p2-color);
    height: 4px;
  }
  .slider-val {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--text);
    min-width: 36px;
    text-align: right;
  }
  .rec-hint {
    font-size: .72rem;
    color: var(--p2-color);
    min-height: 1em;
  }

  /* ── Toggle orden aleatorio ── */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  /* Oculto visualmente pero presente para teclado/lector de pantalla —
     NUNCA display:none, eso lo sacaría también del árbol de accesibilidad */
  .sr-toggle-input {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
  .sr-toggle-input:focus-visible + .toggle-track {
    outline: 3px solid var(--p2-color);
    outline-offset: 2px;
  }
  .toggle-track {
    width: 46px; height: 26px;
    background: var(--border);
    border-radius: 13px;
    position: relative;
    flex-shrink: 0;
    transition: background .25s;
  }
  .toggle-track.on { background: var(--p2-color); }
  .toggle-thumb {
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 3px; left: 3px;
    transition: left .25s;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .toggle-track.on .toggle-thumb { left: 23px; }
  .toggle-label-text { display: flex; flex-direction: column; gap: 1px; }
  .toggle-label-text span { font-size: .88rem; font-weight: 600; color: var(--text); }
  .toggle-sub { font-size: .72rem !important; font-weight: 400 !important; color: var(--muted) !important; }

  /* ── Selector de jugadores: píldora deslizante (mismo patrón que el
     selector de idioma de elige-tu-pan-quiz) ── */
  .player-count-row {
    position: relative;
    display: flex;
    gap: 8px;
  }
  .pc-thumb {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    border-radius: 10px;
    background: var(--surface);
    border: 2px solid var(--p1-color);
    transition: transform .32s cubic-bezier(.65,0,.35,1), width .32s cubic-bezier(.65,0,.35,1), opacity .15s ease;
    z-index: 0;
    pointer-events: none;
  }
  .pc-thumb.is-dragging { transition: opacity .15s ease; }
  .pc-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 10px;
    color: var(--muted);
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 10px 4px;
    cursor: grab;
    touch-action: none;
    text-align: center;
    transition: color .2s ease;
  }
  .pc-btn.is-active { color: var(--p1-color); }
  .pc-btn.is-origin { background: var(--p2-light); color: var(--p2-color); border-radius: 10px; }

  /* El selector de dificultad no tiene la píldora deslizante (no hace
     falta para 3 opciones fijas) — necesita su propio estado seleccionado
     visible por sí solo, no solo el color de texto que usa .pc-btn.is-active
     ahí arriba (que depende de la píldora de fondo para leerse bien). */
  .diff-btn.is-active {
    background: var(--surface);
    border-color: var(--p1-color);
    color: var(--p1-color);
  }
  .solo-banner {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    text-align: center;
    margin-bottom: 10px;
    color: var(--text);
  }

  /* ── Botones flotantes de esquina (tema, info) ── */
  .corner-btn {
    position: fixed;
    bottom: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 40;
    box-shadow: 0 8px 20px -10px rgba(0,0,0,.35);
  }
  .corner-btn.bottom-left { left: 16px; }
  .corner-btn.bottom-right { right: 16px; }
  .corner-btn:hover { color: var(--text); border-color: var(--p1-color); }

  /* ── Panel de info ── */
  .info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .info-overlay.show { display: flex; }
  .info-sheet {
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 28px 24px 30px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    border-top: 2px solid var(--border);
  }
  .info-sheet h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; }
  .info-rows { width: 100%; max-width: 260px; margin: 4px 0; }
  .info-rows > div {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: .9rem;
  }
  .info-rows dt { color: var(--muted); }
  .info-rows dd { margin: 0; font-weight: 700; }
  /* ── Confeti ── */
  .confetti-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 60;
  }
  .confetti-piece {
    position: absolute;
    top: -5%;
    border-radius: 2px;
    opacity: .9;
    animation-name: confetti-fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift), 110vh) rotate(var(--rot)); opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1f2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Círculos">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<h1>⬤ Juego de Círculos</h1>
<div id="versionTag" style="font-size:.72rem;color:var(--muted);letter-spacing:1px;margin-top:-8px;"></div>

<!-- Config de nombres -->
<div id="setupPanel" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:480px;">
  <div class="setup-box">

    <!-- Número de jugadores -->
    <div class="setup-section">
      <div class="setup-label">Número de jugadores</div>
      <div class="player-count-row" id="pcRow" role="radiogroup" aria-label="Número de jugadores">
        <button type="button" class="pc-btn" data-n="1" role="radio" aria-checked="false" onclick="pcButtonClick(1)" style="font-size:.85rem;">Solo</button>
        <button type="button" class="pc-btn" data-n="2" role="radio" aria-checked="false" onclick="pcButtonClick(2)">2</button>

<script>
// ── Constantes ──────────────────────────────────────────────────────────────
// Única fuente de la versión visible — antes se escribía a mano en tres
// sitios (aquí, el panel de info, y el CACHE de sw.js) y se desincronizaban
// entre sí. sw.js sigue siendo aparte por necesidad (un service worker no
// puede leer esta constante, vive en otro archivo) — al subir de versión,
// solo hace falta tocar ESTA línea y la de sw.js, no una tercera copia más.
const APP_VERSION = 'v2.41';
// ?debug en la URL: números de índice en los círculos + tabla de métricas
// del grafo de adyacencia en consola al generar el tablero.
const DEBUG = new URLSearchParams(location.search).has('debug');

let CIRCLE_R  = 14;    // radio visual (se recalcula según N_CIRCLES)
let HIT_R     = 22;    // radio de click (siempre táctil)
let MIN_DIST  = 70;    // distancia mínima entre centros (se recalcula)
let MAX_DIST  = 160;   // distancia máxima para ser adyacentes (se recalcula)
let MAX_DIST_SQ = MAX_DIST * MAX_DIST; // fuente de verdad para comparar — evita el sqrt en cada comprobación
let N_CIRCLES = 35;    // número de círculos (configurable)

// Disposiciones de puntos en el dado (cuadrícula 3x3, índices 0-8)
const DICE_DOTS = {
  1: [4],
  2: [0,8],
  3: [0,4,8],
  4: [0,2,6,8],
  5: [0,2,4,6,8],
  6: [0,2,3,5,6,8]
};

// ── Estado ──────────────────────────────────────────────────────────────────
let circles = [];      // {x,y}
let edges   = new Set(); // "i-j" (i<j)
let triangles= [];     // {a,b,c,owner}
let players = [{name:'J1',initial:'J',score:0,colorIndex:0},{name:'J2',initial:'J',score:0,colorIndex:1}];
// Se incrementa en cada startGame() — cualquier callback asíncrono de la IA
// (setTimeout de pensar/tirar/jugar) captura el valor vigente al crearse y
// lo compara antes de actuar. Sin esto, reiniciar mientras la máquina
// "piensa" podía dejar un timer de la partida VIEJA resolviendo dentro de
// la partida nueva — el mismo tipo de fallo que ya se corrigió para el
// dado (resetRollState), pero sin cubrir la secuencia completa de la IA.
let gameGeneration = 0;
// Estado explícito de la partida — 'setup' | 'playing' | 'finished'. Toda
// acción que solo tiene sentido durante partida activa (dado, canvas, IA,
// cambio de turno) debe comprobarlo, en vez de inferirlo indirectamente de
// otras variables (diceRolled, isAITurn, etc. por separado, que es como
// estaba antes y podía desincronizarse).
let gameStatus = 'setup';
// Deshacer: solo la ÚLTIMA jugada, y solo mientras no haya pasado nada más
// desde entonces (ni otra jugada, ni una tirada nueva) — se sobreescribe o
// se limpia en cuanto ocurre cualquiera de esas dos cosas.
let lastMoveSnapshot = null;
// Resalta un momento la última línea trazada por la máquina, para que se
// note bien dónde ha jugado — sin esto, con varias líneas seguidas era
// fácil perderse cuál era la nueva.
let lastAIEdgeKey = null;
let lastAIEdgeColor = null;
let aiHighlightGen = 0;
const AI_HIGHLIGHT_MS = 1000;
// Margen tras tu última línea de turno, antes de que le toque a Circuit —
// tiempo de sobra para reconocer y deshacer una línea mal puesta.
const TURN_HANDOFF_GRACE_MS = 3000;

// El color de un jugador es su identidad (colorIndex, fijado al escribir su
// nombre) — NO su posición actual en el array, que cambia si el orden de
// turno se sortea. Usar el índice de turno directamente aquí es el bug que
// hacía que el color visto al escribir el nombre no coincidiera con el
// color mostrado ya jugando, si "orden aleatorio" estaba activado.
function playerColor(turnIdx) {
  const p = players[turnIdx];
  return p ? PLAYER_COLORS[p.colorIndex] : undefined;
}

// Se me había colado esta variante (PLAYER_COLORS_LIGHT) en el arreglo
// anterior de identidad de color — mismo problema, mismo porqué.
function playerLightColor(turnIdx) {
  const p = players[turnIdx];
  return p ? PLAYER_COLORS_LIGHT[p.colorIndex] : 'rgba(255,255,255,0.1)';
}
let currentPlayer = 0;
let linesLeft = 0;     // líneas que puede trazar este turno (tras tirar dado)
let diceRolled = false;
let selectedCircle = null;

function getLegalTargets(origin) {
  const targets = new Set();
  for (const target of candidateNeighbors[origin] || []) {
    if (checkMoveValidity(origin, target).valid) targets.add(target);
  }
  return targets;
}

// Único punto que cambia selectedCircle — así selectedTargetsCache nunca
// se desincroniza de qué círculo está seleccionado de verdad.
function setSelectedCircle(idx) {
  selectedCircle = idx;
  selectedTargetsCache = (idx === null) ? null : getLegalTargets(idx);
}

let canvas, ctx, W, H;

// ── modules/buttons (pwa-template) ──────────────────────────────────────────
// Mismo vocabulario HAPTIC.* que pwa-template/modules/buttons/vanilla — se
// inlinea aquí en vez de importarlo porque este proyecto es un único HTML
// sin módulos ES. Si el módulo cambia en pwa-template, sincronizar a mano.
const HAPTIC = {
  tap: 8,
  select: 12,
  toggleOn: [10, 30, 10],
  toggleOff: 10,
  dismiss: 15,
  celebrate: [15, 60, 15, 60, 40]
};

function vibrate(pattern = HAPTIC.tap) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch { /* ignorar */ }
  }
}

// Sonido: solo para el momento de "acierto" real del juego (cerrar un
// triángulo), no para cada tap — ver criterio en modules/buttons/README.md.
let audioCtx = null;
function getAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioCtx) audioCtx = new AudioContextClass();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx, { freq, start, duration, type = 'sine', gain = 0.16 }) {
  const osc = ctx.createOscillator();
  const gainNode = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gainNode.gain.setValueAtTime(gain, start);
  gainNode.gain.exponentialRampToValueAtTime(0.001, start + duration);
  osc.connect(gainNode);
  gainNode.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration);
}
function playSuccessSound() {
  const ctx = getAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime;
  tone(ctx, { freq: 587.33, start: now, duration: 0.12 }); // D5
  tone(ctx, { freq: 880, start: now + 0.09, duration: 0.18 }); // A5
}

// ── Tema claro/oscuro ────────────────────────────────────────────────────────
const THEME_KEY = 'juego-circulos-theme';

function getInitialTheme() {
  try {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === 'light' || stored === 'dark') return stored;
  } catch { /* sin storage disponible */ }
  return window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f8' : '#1a1f2e');
  const icon = document.getElementById('themeIcon');
  if (icon) {
    icon.innerHTML = theme === 'dark'
      ? '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />'
      : '<circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" /><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></g>';
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch { /* ignorar */ }
}

function toggleTheme() {
  vibrate(HAPTIC.select);
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
  if (ctx && circles.length) draw(); // repintar ya, no esperar a la siguiente jugada
}

// ── Selector de jugadores: píldora deslizante (mismo patrón que el
// selector de idioma de elige-tu-pan-quiz, adaptado a JS sin React) ─────────
const PC_PADDING = 0;      // .player-count-row no tiene padding propio
const PC_DRAG_THRESHOLD = 6;
let pcRowEl, pcThumbEl;
let pcThumb = { x: 0, width: 0, ready: false };
let pcGesture = { startX: 0, thumbStartX: 0, moved: false, pointerId: null, hoverN: null };
// Bandera de un solo uso — pcGesture.moved se queda en `true` hasta el
// siguiente pointerdown, así que si tras arrastrar alguien activa un
// botón por teclado (Tab + Enter, sin pasar por pointerdown/up en
// absoluto) ese clic se suprimía por error, sin tener nada que ver con
// ningún arrastre. Esta bandera se consume la primera vez que se usa.
let suppressNextPcClick = false;

function pcRenderThumb() {
  pcThumbEl.style.transform = `translateX(${pcThumb.x}px)`;
  pcThumbEl.style.width = `${pcThumb.width}px`;
  pcThumbEl.style.opacity = pcThumb.ready ? '1' : '0';
}

function pcMeasure() {
  const btn = pcRowEl.querySelector(`.pc-btn[data-n="${numPlayers}"]`);
  if (!btn) return;
  const rowBox = pcRowEl.getBoundingClientRect();
  const btnBox = btn.getBoundingClientRect();
  pcThumb = { x: btnBox.left - rowBox.left, width: btnBox.width, ready: true };
  pcRenderThumb();
}

function pcClosestForCenterX(centerX) {
  const rowBox = pcRowEl.getBoundingClientRect();
  let closest = numPlayers, closestDist = Infinity;
  pcRowEl.querySelectorAll('.pc-btn').forEach((btn) => {
    const n = parseInt(btn.dataset.n, 10);
    const box = btn.getBoundingClientRect();
    const center = box.left - rowBox.left + box.width / 2;
    const d = Math.abs(center - centerX);
    if (d < closestDist) { closestDist = d; closest = n; }
  });
  return closest;
}

function pcUpdateButtonClasses(dragging) {
  pcRowEl.querySelectorAll('.pc-btn').forEach((btn) => {
    const n = parseInt(btn.dataset.n, 10);
    btn.classList.remove('is-active', 'is-origin');
    if (dragging) {
      if (n === pcGesture.hoverN) btn.classList.add('is-active');
      else if (n === numPlayers) btn.classList.add('is-origin');
    } else if (n === numPlayers) {
      btn.classList.add('is-active');
    }
    // aria-checked refleja la selección real, no el resaltado de arrastre
    btn.setAttribute('aria-checked', n === numPlayers ? 'true' : 'false');
  });
}

function pcButtonClick(n) {
  if (suppressNextPcClick) { suppressNextPcClick = false; return; } // clic sintético justo tras un arrastre
  setPlayerCount(n);
}

function pcPointerDown(e) {
  pcGesture = { startX: e.clientX, thumbStartX: pcThumb.x, moved: false, pointerId: e.pointerId, hoverN: numPlayers };
  e.currentTarget.setPointerCapture(e.pointerId);
}

function pcPointerMove(e) {
  if (pcGesture.pointerId !== e.pointerId) return;
  const deltaX = e.clientX - pcGesture.startX;
  if (!pcGesture.moved && Math.abs(deltaX) < PC_DRAG_THRESHOLD) return;

  if (!pcGesture.moved) {
    pcGesture.moved = true;
    pcThumbEl.classList.add('is-dragging');
  }

  const rowBox = pcRowEl.getBoundingClientRect();
  const maxX = rowBox.width - pcThumb.width - PC_PADDING;
  pcThumb.x = Math.max(PC_PADDING, Math.min(pcGesture.thumbStartX + deltaX, maxX));
  pcRenderThumb();

  const overN = pcClosestForCenterX(pcThumb.x + pcThumb.width / 2);
  if (overN !== pcGesture.hoverN) {
    pcGesture.hoverN = overN;
    vibrate(HAPTIC.tap); // toque al cruzar, mismo criterio que el selector de idioma
    pcUpdateButtonClasses(true);
  }
}

function pcPointerUp(e) {
  if (pcGesture.pointerId !== e.pointerId) return;
  if (pcGesture.moved) {
    suppressNextPcClick = true; // el clic sintético que sigue a este pointerup no debe re-disparar setPlayerCount
    pcThumbEl.classList.remove('is-dragging');
    const closest = pcClosestForCenterX(pcThumb.x + pcThumb.width / 2);
    if (closest !== numPlayers) setPlayerCount(closest);
    else { pcMeasure(); pcUpdateButtonClasses(false); }
  }
}

function pcPointerCancel(e) {
  if (pcGesture.pointerId !== e.pointerId) return;
  pcThumbEl.classList.remove('is-dragging');
  pcMeasure();
  pcUpdateButtonClasses(false);
}

function initPlayerCountSelector() {
  pcRowEl = document.getElementById('pcRow');
  pcThumbEl = document.createElement('span');
  pcThumbEl.className = 'pc-thumb';
  pcThumbEl.setAttribute('aria-hidden', 'true');
  pcRowEl.prepend(pcThumbEl);

  pcRowEl.querySelectorAll('.pc-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', pcPointerDown);
    btn.addEventListener('pointermove', pcPointerMove);
    btn.addEventListener('pointerup', pcPointerUp);
    btn.addEventListener('pointercancel', pcPointerCancel);
  });

  window.addEventListener('resize', pcMeasure);
  pcMeasure();
  pcUpdateButtonClasses(false);
}

// ── Inicio ──────────────────────────────────────────────────────────────────
function startGame() {
  gameGeneration++;
  lastMoveSnapshot = null;
  lastAIEdgeKey = null;
  aiHighlightGen++;
  stopUndoCountdown();
  vibrate(HAPTIC.celebrate);
  resetRollState();
  // Leer nombres dinámicos
  players = [];
  for (let i = 0; i < numPlayers; i++) {
    const el = document.getElementById(`nameInput${i}`);
    const raw = el ? el.value.trim() : '';
    const name = raw || `Jugador ${i+1}`;
    players.push({name, initial: name[0].toUpperCase(), score: 0, colorIndex: i});
  }
  // Modo "1 jugador": la máquina ocupa el segundo puesto automáticamente
  if (numPlayers === 1) {
    players.push({name: 'Circuit', initial: '🤖', score: 0, colorIndex: 1, isAI: true});
  }
  // Leer número de círculos del slider
  N_CIRCLES = parseInt(document.getElementById('circleSlider').value) || 35;

  document.getElementById('setupPanel').style.display = 'none';
  const ui = document.getElementById('gameUI');
  ui.classList.add('is-active');
  document.body.classList.add('in-game');

  // Orden aleatorio: mezclar array de jugadores si está activado
  if (isRandomOrder()) {
    for (let i = players.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [players[i], players[j]] = [players[j], players[i]];
    }
  }

  closeDialog('modalOverlay');
  buildGameUI();

  canvas = document.getElementById('gameCanvas');
  const wrap = canvas.parentElement;
  const { width, height } = boardDimensions(wrap);
  wrap.style.width = width + 'px';
  wrap.style.height = height + 'px';
  ctx = canvas.getContext('2d');
  applyCanvasSize(width, height);
  W = width;
  H = height;

  edges      = new Set();
  triangles  = [];
  currentPlayer = 0;
  linesLeft  = 0;
  diceRolled = false;
  setSelectedCircle(null);

  if (!generateCircles()) return; // aviso ya mostrado, vuelta al menú ya hecha
  gameStatus = 'playing';
  updateDiceDisplay(0);
  updateActiveCards();
  updateTurnInfo();
  draw();

  canvas.onpointerdown = handleCanvasPointerDown;
  canvas.onpointermove = handleCanvasPointerMove;
  canvas.onpointerup = handleCanvasPointerUp;
  canvas.onpointercancel = handleCanvasPointerCancel;

  // El dado es el siguiente paso lógico de cualquier partida nueva —
  // enfocarlo explícitamente es más fiable que confiar en "vuelve a lo
  // que estuviera enfocado antes", sobre todo tras cerrar el modal de fin
  // de partida.
  requestAnimationFrame(() => {
    document.getElementById('dice')?.focus();
  });

  scheduleAITurnIfNeeded();
}

function confirmNewGame() {
  vibrate(HAPTIC.tap);
  if (confirm('¿Empezar nuevo juego?')) startGame();
}

// ── Generación de círculos ───────────────────────────────────────────────────
let candidatePairs = [];       // [{i,j,distSq}, ...] — solo parejas dentro de MAX_DIST
let candidateNeighbors = [];   // candidateNeighbors[i] = [j, k, ...]

// generateCirclePositions()/buildCandidateGraph()/attemptBoardGeneration()
// ahora vienen de src/game/board.js

function generateCircles() {
  // Ajustar tamaño y distancias según N_CIRCLES
  // Radio visual: interpola entre 16px (25 círculos) y 7px (100 círculos)
  CIRCLE_R = Math.round(16 - (N_CIRCLES - 25) * (9 / 75));
  CIRCLE_R = Math.max(7, Math.min(16, CIRCLE_R));
  // Hit area táctil: siempre al menos 20px, escala un poco con el círculo
  HIT_R = Math.max(20, CIRCLE_R + 8);

  // Distancias: basadas en área disponible por círculo
  const area = W * H;
  const areaPerCircle = area / N_CIRCLES;
  const avgDist = Math.sqrt(areaPerCircle);
  MIN_DIST = Math.max(CIRCLE_R * 2 + 6, avgDist * 0.55);

  invalidateActiveCirclesCache();
  selectedTargetsCache = null;

  // 20 intentos a distancia completa; si ninguno cupo entero o ninguno
  // llegó ni al mínimo aceptable, relajar MIN_DIST progresivamente (3%
  // cada vez, 10 intentos por escalón) en vez de aceptar un tablero con
  // menos círculos de los pedidos — eso sería silencioso e imposible de
  // notar hasta que alguien contara los círculos.
  let best = attemptBoardGeneration(MIN_DIST, 20);
  for (const relax of [0.97, 0.94, 0.91, 0.88]) {
    if (best) break;
    best = attemptBoardGeneration(MIN_DIST * relax, 10);
  }

  if (!best) {
    // Ni relajando MIN_DIST cuatro veces se consiguió un tablero completo
    // — situación extremadamente rara (pantalla minúscula pidiendo 100
    // círculos). Mejor avisar con claridad y volver al menú que arrancar
    // con un tablero roto.
    alert('No se ha podido generar el tablero con este número de círculos. Prueba con menos, o con más espacio en pantalla.');
    document.getElementById('gameUI').classList.remove('is-active');
    document.getElementById('setupPanel').style.display = 'flex';
    document.body.classList.remove('in-game');
    gameStatus = 'setup';
    return false;
  }

  circles = best.positions;
  MAX_DIST = best.adjacency.maxDistance;
  MAX_DIST_SQ = best.adjacency.maxDistanceSq;
  buildCandidateGraph(best.adjacency.pairs);

  if (DEBUG && best.adjacency.metrics) {
    console.table({ N_CIRCLES, MAX_DIST: Math.round(MAX_DIST), ...best.adjacency.metrics });
  }
  return true;
}

// ADJACENCY_TARGET, chooseAdjacency() y finalizeAdjacency() ahora vienen
// de src/game/board.js

// ── Dado ─────────────────────────────────────────────────────────────────────
let isRolling = false;
// El valor tirado, aparte de linesLeft — linesLeft baja según trazas
// líneas, pero los puntos del dado deben seguir mostrando el número que
// salió hasta que termine el turno, no vaciarse con cada línea.
let lastRolledValue = 0;
let rollTimer = null;

// Cancela cualquier tirada pendiente — sin esto, tirar el dado y darle a
// "Nuevo juego" antes de que pasen los 420ms del giro podía dejar que la
// tirada de la partida VIEJA resolviera dentro de la partida nueva.
function resetRollState() {
  if (rollTimer !== null) {
    clearTimeout(rollTimer);
    rollTimer = null;
  }
  isRolling = false;
  const dice = document.getElementById('dice');
  if (dice) {
    dice.classList.remove('rolling');
    dice.removeAttribute('aria-disabled');
  }
}

// Única fuente de verdad de "¿se puede tirar el dado ahora?" — antes esta
// misma condición estaba repartida entre el guard de rollDice() y la
// sincronización del atributo disabled del botón por separado, con riesgo
// de que se desincronizaran entre sí.
function canRollDice() {
  return gameStatus === 'playing' &&
    !isAITurn() &&
    !isRolling &&
    !(diceRolled && linesLeft > 0);
}

function rollDice(isAICall) {
  const allowed = isAICall
    ? (gameStatus === 'playing' && isAITurn() && !isRolling && !(diceRolled && linesLeft > 0))
    : canRollDice();
  if (!allowed) return;
  isRolling = true;
  const dice = document.getElementById('dice');
  dice.classList.remove('waiting');
  dice.classList.add('rolling');
  dice.setAttribute('aria-disabled', 'true');
  rollTimer = setTimeout(() => {
    rollTimer = null;
    isRolling = false;
    if (!isAITurn()) {
      lastMoveSnapshot = null; // el deshacer solo vale hasta tu siguiente tirada — el turno de Circuit de por medio no cuenta
      syncUndoEnabled();
    }
    dice.classList.remove('rolling');
    dice.removeAttribute('aria-disabled');
    const val = Math.floor(Math.random() * 6) + 1;
    linesLeft  = val;
    lastRolledValue = val;
    diceRolled = true;
    vibrate(HAPTIC.select);
    updateDiceDisplay(val);
    syncDiceEnabled();
    // Comprobar si hay movimientos disponibles tras tirar
    const active = computeActiveCircles();
    if (active.size === 0) {
      endGame();
      return;
    }
    updateTurnInfo();
    draw();
  }, 420);
}

function updateDiceDisplay(val) {
  const dots = document.querySelectorAll('.dot');
  dots.forEach(d => d.classList.remove('on'));
  if (val > 0) {
    DICE_DOTS[val].forEach(i => dots[i].classList.add('on'));
  }
  // val===0 significa siempre "esperando a que lo pulses" (ver la etiqueta
  // de abajo) — el CSS decide si de verdad anima según si en ese momento
  // está también habilitado (no anima durante el turno de Circuit).
  document.getElementById('dice')?.classList.toggle('waiting', val === 0);
  const ll = document.getElementById('linesLeftLabel');
  if (val === 0) {
    ll.textContent = 'Tira el dado';
  } else if (linesLeft > 0) {
    ll.textContent = `${linesLeft} línea${linesLeft !== 1 ? 's' : ''}`;
  } else {
    ll.textContent = 'Sin líneas';
  }
}

// ── Canvas click ──────────────────────────────────────────────────────────────
// ── Canvas: seleccionar/trazar, por tap o por arrastre ──────────────────────
// Mismo patrón de "detectar arrastre por umbral de movimiento" que el
// selector de idioma/jugadores: pointerdown no decide nada por sí solo, el
// pointerup decide si fue un tap (se comporta exactamente como antes) o un
// arrastre real (traza la línea directamente al soltar sobre el destino).
let traceGesture = { pointerId: null, startX: 0, startY: 0, origin: null, moved: false, curX: 0, curY: 0, hoverTarget: null, hoverValid: null };
const TRACE_DRAG_THRESHOLD = 10; // px en coordenadas del tablero, no de pantalla

function boardPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return { mx: (e.clientX - rect.left) * scaleX, my: (e.clientY - rect.top) * scaleY };
}

function hitTestCircle(mx, my) {
  return circles.findIndex(c => dist(mx, my, c.x, c.y) < HIT_R);
}

function handleCanvasPointerDown(e) {
  if (gameStatus !== 'playing' || isAITurn() || !diceRolled || linesLeft <= 0) return;
  const { mx, my } = boardPoint(e);
  const hit = hitTestCircle(mx, my);

  // origin puede ser -1 (empezó en espacio vacío) — se sigue trackeando el
  // gesto para que soltar ahí mismo deseleccione, igual que el click de
  // siempre sobre espacio vacío.
  traceGesture = { pointerId: e.pointerId, startX: mx, startY: my, origin: hit, moved: false, curX: mx, curY: my, hoverTarget: null, hoverValid: null };
  canvas.setPointerCapture(e.pointerId);
}

let drawRequested = false;
function requestDraw() {
  if (drawRequested) return;
  drawRequested = true;
  requestAnimationFrame(() => {
    drawRequested = false;
    draw();
  });
}

function handleCanvasPointerMove(e) {
  if (traceGesture.pointerId !== e.pointerId) return;
  const { mx, my } = boardPoint(e);

  if (!traceGesture.moved) {
    if (dist(traceGesture.startX, traceGesture.startY, mx, my) < TRACE_DRAG_THRESHOLD) return;
    traceGesture.moved = true;
    if (traceGesture.origin >= 0) setSelectedCircle(traceGesture.origin);
  }
  traceGesture.curX = mx;
  traceGesture.curY = my;

  if (traceGesture.origin >= 0) {
    const hoverTarget = hitTestCircle(mx, my);
    if (hoverTarget !== traceGesture.hoverTarget) {
      traceGesture.hoverTarget = hoverTarget;
      traceGesture.hoverValid = (hoverTarget === -1 || hoverTarget === traceGesture.origin)
        ? null // sin objetivo claro todavía — no colorear de rojo/verde
        : checkMoveValidity(traceGesture.origin, hoverTarget).valid;
    }
    // Un solo draw() por frame, no uno por cada pointermove — en algunos
    // dispositivos ese evento llega con más frecuencia de la que la
    // pantalla puede pintar de verdad.
    requestDraw();
  }
}

function handleCanvasPointerUp(e) {
  if (traceGesture.pointerId !== e.pointerId) return;
  const { mx, my } = boardPoint(e);
  const origin = traceGesture.origin;
  const wasDrag = traceGesture.moved;
  traceGesture = { pointerId: null, startX: 0, startY: 0, origin: null, moved: false, curX: 0, curY: 0 };

  if (origin === -1) {
    // Empezó en espacio vacío: deseleccionar, igual que el tap de siempre
    // sobre espacio vacío.
    setSelectedCircle(null);
    draw();
    return;
  }

  if (wasDrag) {
    const hit = hitTestCircle(mx, my);
    if (hit === -1 || hit === origin) {
      // soltó fuera del tablero o volvió al mismo círculo: cancela el
      // trazo, pero deja el círculo seleccionado para reintentarlo
      setSelectedCircle(origin);
      draw();
      return;
    }
    attemptConnect(origin, hit);
    return;
  }

  // No hubo arrastre real (movimiento por debajo del umbral): tap normal,
  // exactamente el mismo comportamiento de siempre.
  if (selectedCircle === null) {
    setSelectedCircle(origin);
    vibrate(HAPTIC.tap);
    draw();
    return;
  }
  if (selectedCircle === origin) {
    setSelectedCircle(null);
    draw();
    return;
  }
  attemptConnect(selectedCircle, origin);
}

function handleCanvasPointerCancel(e) {
  if (traceGesture.pointerId !== e.pointerId) return;
  const origin = traceGesture.origin;
  traceGesture = { pointerId: null, startX: 0, startY: 0, origin: null, moved: false, curX: 0, curY: 0 };
  if (origin >= 0) setSelectedCircle(origin);
  draw();
}

// MOVE_REASON_TEXT, checkMoveValidity() y triangleTraps() ahora vienen de
// src/game/rules.js

let lastInvalidReasonTimer = null;

function showInvalidMoveReason(message) {
  const el = document.getElementById('turnInfo');
  const original = el.dataset.originalHtml ?? el.innerHTML;
  el.dataset.originalHtml = original;
  el.innerHTML = `<span style="color:var(--p1-color)">⚠ ${escapeHtml(message)}</span>`;
  clearTimeout(lastInvalidReasonTimer);
  lastInvalidReasonTimer = setTimeout(() => {
    el.innerHTML = el.dataset.originalHtml;
    delete el.dataset.originalHtml;
  }, 1400);
}

function attemptConnect(fromIdx, toIdx) {
  const check = checkMoveValidity(fromIdx, toIdx);

  if (!check.valid) {
    // no se puede conectar con ese destino: lo dejamos seleccionado, igual
    // que al tocar un destino inválido en el flujo de siempre — pero ahora
    // además se explica por qué, en vez de simplemente no pasar nada
    vibrate(HAPTIC.dismiss);
    showInvalidMoveReason(check.message);
    setSelectedCircle(toIdx);
    draw();
    return;
  }

  const a = Math.min(fromIdx, toIdx);
  const b = Math.max(fromIdx, toIdx);
  const key = `${a}-${b}`;

  // Foto de "cómo estaba todo justo antes de esta jugada" — deshacer()
  // solo necesita volver a esto, sin tener que reconstruir nada a mano.
  // Se sobreescribe en cada jugada nueva del HUMANO — las jugadas de
  // Circuit no la tocan ni la borran, para que el turno de la máquina de
  // por medio no "consuma" tu última línea sin que te dé tiempo a
  // deshacerla.
  if (!players[currentPlayer]?.isAI) {
    lastMoveSnapshot = {
      edgeKey: key,
      currentPlayer,
      linesLeft,
      diceRolled,
      gameStatus,
      scorerIdx: currentPlayer,
      trianglesCountBefore: triangles.length
    };
  }

  // Trazar
  edges.add(key);
  invalidateActiveCirclesCache();
  linesLeft--;
  syncUndoEnabled();

  // Resaltar un momento la línea recién trazada si fue la máquina — con
  // varias líneas seguidas era fácil perder de vista dónde había jugado
  // cada una. Se apaga sola, forzando un redraw cuando expira, no solo
  // cuando algo más redibuja por su cuenta.
  if (players[currentPlayer]?.isAI) {
    lastAIEdgeKey = key;
    lastAIEdgeColor = playerColor(currentPlayer);
    const highlightGen = ++aiHighlightGen;
    setTimeout(() => {
      if (highlightGen === aiHighlightGen) { lastAIEdgeKey = null; draw(); }
    }, AI_HIGHLIGHT_MS);
  }

  // Buscar triángulos nuevos
  const newTris = findNewTriangles(a, b);
  newTris.forEach(tri => {
    triangles.push({...tri, owner: currentPlayer});
    players[currentPlayer].score++;
  });
  updateScores();

  if (newTris.length > 0) {
    // Cerrar un triángulo es el "acierto" real del juego — feedback fuerte
    vibrate(HAPTIC.celebrate);
    playSuccessSound();
  } else {
    vibrate(HAPTIC.select);
  }

  setSelectedCircle(null);
  draw();

  if (linesLeft === 0) {
    diceRolled = false;
    updateDiceDisplay(0);
    if (computeActiveCircles().size === 0) { endGame(); return; }
    if (!players[currentPlayer]?.isAI) {
      // Margen antes de pasarle el turno a Circuit — mientras no se llame
      // a advanceTurn(), currentPlayer sigue siendo el tuyo, así que
      // deshacer sigue disponible exactamente igual que con cualquier
      // otra de tus líneas. Sin esto, la línea que TERMINA tu turno era
      // justo la que menos margen tenía (cero: el cambio de turno era
      // síncrono e inmediato).
      const el = document.getElementById('turnInfo');
      const color = playerColor(currentPlayer) || 'var(--p1-color)';
      el.innerHTML = `<span style="color:${color}">${escapeHtml(players[currentPlayer].name)}</span> — ¿todo bien? Puedes deshacer`;
      startUndoCountdown(TURN_HANDOFF_GRACE_MS);
      const handoffGeneration = gameGeneration;
      setTimeout(() => {
        if (handoffGeneration === gameGeneration && gameStatus === 'playing') {
          stopUndoCountdown();
          advanceTurn();
        }
      }, TURN_HANDOFF_GRACE_MS);
    } else {
      advanceTurn();
    }
  } else {
    // Quedan líneas — ¿hay movimientos válidos?
    if (computeActiveCircles().size === 0) { endGame(); return; }
    updateDiceDisplay(lastRolledValue);
    document.getElementById('linesLeftLabel').textContent = `${linesLeft} línea${linesLeft !== 1 ? 's' : ''}`;
    updateTurnInfo();
  }
  draw();
}

// edgeExists()/connectionCount()/areAdjacent()/lineIntersectsAny()/
// findNewTriangles() ahora vienen de src/game/rules.js

// ── ¿Quedan movimientos? ──────────────────────────────────────────────────────
// Antes había dos funciones (noMoreMoves/circlesWithMoves) que recorrían
// exactamente el mismo cálculo por separado — y como ahora draw() se llama
// en cada pointermove mientras arrastras una línea, ese recálculo O(n²)
// completo se repetía decenas de veces por segundo sin que cambiara nada.
// Una sola función, cacheada, y solo se invalida cuando de verdad cambia
// algo (se traza una línea, o se genera un tablero nuevo).
let activeCirclesCache = null;
// Destinos válidos del círculo actualmente seleccionado — se recalcula solo
// al seleccionar uno nuevo, no en cada draw() (que ahora corre en cada
// pointermove durante un arrastre).
let selectedTargetsCache = null;

// ── Diálogos accesibles ──────────────────────────────────────────────────
// Escape cierra, el foco entra al abrir y vuelve a quien lo abrió al
// cerrar, y Tab se queda atrapado dentro mientras el diálogo está abierto.
let lastFocusedBeforeDialog = null;

function focusableIn(overlay) {
  return Array.from(
    overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
  );
}

function openDialog(overlayId) {
  const overlay = document.getElementById(overlayId);
  lastFocusedBeforeDialog = document.activeElement;
  overlay.classList.add('show');
  const focusable = focusableIn(overlay);
  if (focusable.length) focusable[0].focus();
}

function closeDialog(overlayId) {
  const overlay = document.getElementById(overlayId);
  overlay.classList.remove('show');
  if (lastFocusedBeforeDialog && document.contains(lastFocusedBeforeDialog)) {
    lastFocusedBeforeDialog.focus();
  }
  lastFocusedBeforeDialog = null;
}

document.addEventListener('keydown', (e) => {
  ['modalOverlay', 'infoOverlay'].forEach((id) => {
    const overlay = document.getElementById(id);
    if (!overlay || !overlay.classList.contains('show')) return;

    if (e.key === 'Escape') {
      closeDialog(id);
      return;
    }
    if (e.key === 'Tab') {
      const focusable = focusableIn(overlay);
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });
});

function invalidateActiveCirclesCache() {
  activeCirclesCache = null;
  selectedTargetsCache = null;
}

// Telemetría de lo que de verdad importaba en rendimiento — el arrastre
// llama a esto (vía draw()) muchas veces por segundo, así que es donde se
// nota si algo se pone lento con tableros grandes/muchas líneas trazadas.
// Solo se activa con ?debug, no tiene coste en la partida normal.
const PERF = { legalStateCalls: 0, legalStateTotalMs: 0, legalStateMaxMs: 0 };

function computeActiveCircles() {
  if (activeCirclesCache !== null) return activeCirclesCache;
  const t0 = DEBUG ? performance.now() : 0;
  const active = new Set();
  // Recorre solo candidatePairs (las parejas dentro de MAX_DIST que se
  // precalcularon al generar el tablero) en vez de las N² parejas
  // completas — con grado medio ~10 y 100 círculos, eso son ~500 parejas
  // en vez de 4.950. checkMoveValidity() sigue siendo la única fuente de
  // verdad para las reglas dinámicas (arista existe, cruces, atrapa
  // círculo...), esto solo evita repetir el filtro de distancia de nuevo.
  for (const { i, j } of candidatePairs) {
    if (checkMoveValidity(i, j).valid) {
      active.add(i);
      active.add(j);
    }
  }
  activeCirclesCache = active;
  if (DEBUG) {
    const elapsed = performance.now() - t0;
    PERF.legalStateCalls++;
    PERF.legalStateTotalMs += elapsed;
    PERF.legalStateMaxMs = Math.max(PERF.legalStateMaxMs, elapsed);
  }
  return active;
}

// Con ?debug en la URL: window.circlesPerf() en la consola del navegador
// para ver medias/máximos — útil sobre todo al final de partidas de
// 80-100 círculos, que es donde más aristas y triángulos hay acumulados.
if (DEBUG) {
  window.circlesPerf = () => {
    console.log('computeActiveCircles:', {
      llamadas: PERF.legalStateCalls,
      media: `${(PERF.legalStateTotalMs / (PERF.legalStateCalls || 1)).toFixed(2)}ms`,
      máximo: `${PERF.legalStateMaxMs.toFixed(2)}ms`,
      candidatePairs: candidatePairs.length,
      edges: edges.size,
      triangles: triangles.length
    });
  };
}

// ── UI ────────────────────────────────────────────────────────────────────────
function updateScores() {
  players.forEach((p, i) => {
    const el = document.getElementById(`score${i+1}`);
    if (el) el.textContent = p.score;
  });
}

function syncDiceEnabled() {
  const dice = document.getElementById('dice');
  if (dice) dice.disabled = !canRollDice();
}

function syncUndoEnabled() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = !lastMoveSnapshot || isAITurn();
}

function startUndoCountdown(durationMs) {
  const btn = document.getElementById('undoBtn');
  if (!btn) return;
  stopUndoCountdown(); // por si ya había una en marcha
  const fill = document.createElement('span');
  fill.className = 'countdown-fill';
  fill.style.animationDuration = `${durationMs}ms`;
  fill.setAttribute('aria-hidden', 'true');
  btn.appendChild(fill);
}

function stopUndoCountdown() {
  const btn = document.getElementById('undoBtn');
  const fill = btn?.querySelector('.countdown-fill');
  if (fill) fill.remove();
}

function undoLastMove() {
  if (!lastMoveSnapshot || gameStatus === 'setup' || isAITurn()) return;
  const snap = lastMoveSnapshot;
  lastMoveSnapshot = null;
  gameGeneration++; // por si la IA tenía algo en curso a mitad de deshacer, o el margen antes de su turno
  stopUndoCountdown();
  if (lastAIEdgeKey === snap.edgeKey) { lastAIEdgeKey = null; aiHighlightGen++; }

  const wasFinished = (gameStatus === 'finished');

  edges.delete(snap.edgeKey);
  // Quitar exactamente los triángulos que esta jugada añadió (los que
  // quedaron por encima del recuento de antes) y devolver los puntos.
  while (triangles.length > snap.trianglesCountBefore) {
    const removed = triangles.pop();
    players[removed.owner].score--;
  }
  updateScores();

  currentPlayer = snap.currentPlayer;
  linesLeft = snap.linesLeft;
  diceRolled = snap.diceRolled;
  gameStatus = snap.gameStatus;

  if (wasFinished) closeDialog('modalOverlay'); // la jugada deshecha había terminado la partida

  invalidateActiveCirclesCache();
  setSelectedCircle(null);
  updateDiceDisplay(diceRolled ? lastRolledValue : 0);
  if (diceRolled) {
    document.getElementById('linesLeftLabel').textContent = `${linesLeft} línea${linesLeft !== 1 ? 's' : ''}`;
  }
  updateActiveCards();
  updateTurnInfo();
  syncUndoEnabled();
  vibrate(HAPTIC.dismiss);
  draw();
}

function updateActiveCards() {
  players.forEach((_, i) => {
    const el = document.getElementById(`card${i+1}`);
    if (el) el.classList.toggle('active', currentPlayer === i);
  });
  syncDiceEnabled();
}

function updateTurnInfo() {
  const p = players[currentPlayer];
  const color = playerColor(currentPlayer) || 'var(--p1-color)';
  const el = document.getElementById('turnInfo');
  if (p.isAI) {
    if (!diceRolled) {
      el.innerHTML = `<span style="color:${color}">🤖 ${escapeHtml(p.name)}</span> está pensando…`;
    } else {
      el.innerHTML = `<span style="color:${color}">🤖 ${escapeHtml(p.name)}</span> está jugando…`;
    }
    return;
  }
  if (!diceRolled) {
    el.innerHTML = `Turno de <span style="color:${color}">${escapeHtml(p.name)}</span> — tira el dado`;
  } else {
    el.innerHTML = `<span style="color:${color}">${escapeHtml(p.name)}</span> — traza ${linesLeft} línea${linesLeft!==1?'s':''} más`;
  }
}

function advanceTurn() {
  currentPlayer = (currentPlayer + 1) % players.length;
  updateActiveCards();
  updateTurnInfo();
  draw();
  scheduleAITurnIfNeeded();
}

// ── Modo 1 jugador: la máquina ────────────────────────────────────────────
// UN ÚNICO algoritmo (chooseAIMove) — la dificultad es configuración
// (AI_LEVELS), no tres motores distintos. checkMoveValidity() sigue siendo
// la única fuente de verdad sobre legalidad; la IA nunca se salta esa
// comprobación ni conoce nada que el humano no pudiera calcular él mismo
// mirando el tablero. La dificultad se consigue con "racionalidad
// limitada" (cuánto analiza, con qué frecuencia detecta/elige bien), NO
// haciendo trampas ni mirando la puntuación del rival (nada de
// rubber-banding) — el nivel se mantiene igual gane o pierda.
const AI_LEVELS = {
  easy: {
    scoringAwareness: 0.65,   // prob. de "ver" que hay jugada(s) puntuable(s)
    bestScoringChance: 0.35,  // entre las vistas, prob. de coger la de más triángulos
    scoringPower: 1.2,        // ponderación por triángulos si no coge la mejor
    buildingAwareness: 0.40,  // prob. de aprovechar una construcción propia
    safetyAwareness: 0.45,    // prob. de evitar dejar un cierre servido
    candidateLimit: 20        // cuántos movimientos legales analiza como mucho
  },
  medium: {
    scoringAwareness: 0.88,
    bestScoringChance: 0.60,
    scoringPower: 1.6,
    buildingAwareness: 0.70,
    safetyAwareness: 0.75,
    candidateLimit: 45
  },
  hard: {
    scoringAwareness: 0.98,
    bestScoringChance: 0.88,
    scoringPower: 2.2,
    buildingAwareness: 0.90,
    safetyAwareness: 0.92,
    candidateLimit: 9999 // prácticamente todos
  }
};
let aiDifficulty = 'medium';

function isAITurn() {
  return !!players[currentPlayer]?.isAI;
}

function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function pickUniform(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Selección ponderada por número de triángulos (gain), no determinista —
// más triángulos aumenta la PROBABILIDAD de elegirse, no la garantiza.
// Sin esto, la máquina jugaría sistemáticamente mejor que una persona
// (que no siempre ve/prioriza la jugada objetivamente óptima).
function weightedPickByGain(scoringMoves, power) {
  const weights = scoringMoves.map(m => Math.pow(m.gain, power));
  const total = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let k = 0; k < scoringMoves.length; k++) {
    r -= weights[k];
    if (r <= 0) return [scoringMoves[k].i, scoringMoves[k].j];
  }
  const last = scoringMoves[scoringMoves.length - 1];
  return [last.i, last.j];
}

function chooseAIMove() {
  const level = AI_LEVELS[aiDifficulty] || AI_LEVELS.medium;

  // Movimientos legales — checkMoveValidity() sigue siendo la única fuente
  // de verdad, aquí no se reimplementa ninguna regla por su cuenta.
  const legalMoves = [];
  for (const { i, j } of candidatePairs) {
    if (checkMoveValidity(i, j).valid) legalMoves.push([i, j]);
  }
  if (legalMoves.length === 0) return null;

  // "Visión" limitada según dificultad — no analiza el tablero entero,
  // una muestra al azar de hasta candidateLimit movimientos. Así Fácil de
  // verdad se deja cosas por mirar, no es que juegue mal a propósito con
  // información completa.
  shuffleInPlace(legalMoves);
  const visible = legalMoves.slice(0, level.candidateLimit);

  // Si le queda otra línea este mismo turno, sentar la base de un
  // triángulo no es un regalo al rival — es preparar cerrarlo ella misma
  // en la siguiente jugada (ver v2.27). Solo en la última línea del turno
  // ese mismo patrón sería un regalo de verdad.
  const canFollowUpThisTurn = linesLeft > 1;
  const scoringMoves = []; // {i, j, gain}
  const buildingMoves = [];
  const safeMoves = [];

  for (const [i, j] of visible) {
    const gain = findNewTriangles(i, j).length;
    if (gain > 0) {
      scoringMoves.push({ i, j, gain });
      continue;
    }
    const setsUpReply = createsScoringReply(i, j);
    if (setsUpReply && canFollowUpThisTurn) {
      buildingMoves.push([i, j]);
    } else if (!setsUpReply) {
      safeMoves.push([i, j]);
    }
  }

  // 1. Intentar puntuar ahora
  let selectedType, move;
  if (scoringMoves.length > 0 && Math.random() < level.scoringAwareness) {
    selectedType = 'scoring';
    if (Math.random() < level.bestScoringChance) {
      const maxGain = Math.max(...scoringMoves.map(m => m.gain));
      const best = scoringMoves.filter(m => m.gain === maxGain);
      const chosen = pickUniform(best);
      move = [chosen.i, chosen.j];
    } else {
      move = weightedPickByGain(scoringMoves, level.scoringPower);
    }
  } else if (buildingMoves.length > 0 && Math.random() < level.buildingAwareness) {
    // 2. Preparar un triángulo propio (si le queda otra línea este turno)
    selectedType = 'building';
    move = pickUniform(buildingMoves);
  } else if (safeMoves.length > 0 && Math.random() < level.safetyAwareness) {
    // 3. Evitar dejar un cierre servido
    selectedType = 'safe';
    move = pickUniform(safeMoves);
  } else {
    // 4. No hay alternativa (o el nivel decidió no aplicar ninguna de las
    // anteriores): cualquier movimiento legal de los visibles.
    selectedType = 'any';
    move = pickUniform(visible);
  }

  if (DEBUG) {
    const gain = selectedType === 'scoring' ? findNewTriangles(move[0], move[1]).length : 0;
    window.aiDebug = {
      difficulty: aiDifficulty, linesLeft, legalMoves: legalMoves.length,
      consideredMoves: visible.length, scoringMoves: scoringMoves.length,
      buildingMoves: buildingMoves.length, safeMoves: safeMoves.length,
      selectedType, selectedMove: move, gain
    };
  }
  return move;
}

// Con ?debug: window.circlesAI() en consola para ver la última decisión
// de la máquina — útil para calibrar Fácil/Medio/Difícil tras jugar.
if (DEBUG) {
  window.circlesAI = () => {
    console.table(window.aiDebug || { info: 'la máquina no ha jugado todavía' });
    return window.aiDebug;
  };
}

// ¿Añadir la arista i-j deja lista una jugada posterior que cerraría un
// triángulo? La INTERPRETACIÓN depende de quién juega a continuación:
// con linesLeft>1 puede ser una oportunidad para la propia máquina (ver
// chooseAIMove); con linesLeft===1 sería un regalo al siguiente jugador.
// Esta función solo contesta el hecho geométrico, no decide si es bueno o
// malo — por eso ya no se llama "wouldGift...".
//
// Optimizada: cualquier triángulo nuevo causado por la arista i-j tiene
// que tener la forma i-j-k, así que solo hace falta mirar los vecinos
// candidatos de i o de j, no candidatePairs entero (evitaba acercarse a
// candidatos×candidatos comparaciones). try/finally garantiza que la
// arista de prueba se retira siempre, incluso si algo de en medio lanzara
// un error.
// edgeKey() ahora viene de src/game/rules.js

function createsScoringReply(i, j) {
  const key = edgeKey(i, j);
  edges.add(key);
  try {
    const neighbors = new Set([...(candidateNeighbors[i] || []), ...(candidateNeighbors[j] || [])]);
    for (const k of neighbors) {
      if (k === i || k === j) continue;
      const ik = edgeExists(i, k);
      const jk = edgeExists(j, k);
      if (ik === jk) continue; // hace falta que falte EXACTAMENTE el tercer lado
      const from = ik ? j : i;
      if (!checkMoveValidity(from, k).valid) continue;
      if (findNewTriangles(from, k).length > 0) return true;
    }
    return false;
  } finally {
    edges.delete(key);
  }
}

function scheduleAITurnIfNeeded() {
  if (gameStatus !== 'playing' || !isAITurn()) return;
  const generation = gameGeneration;
  setTimeout(() => {
    if (generation !== gameGeneration || gameStatus !== 'playing' || !isAITurn()) return;
    rollDice(true);
    setTimeout(() => {
      if (generation !== gameGeneration || gameStatus !== 'playing' || !isAITurn()) return;
      runAIMoves(generation);
    }, 700); // algo más que los 420ms de la animación del dado, para que se vea el resultado antes de empezar
  }, 650); // pequeña pausa — que se note que "piensa", no que es instantáneo
}

function runAIMoves(generation) {
  if (generation !== gameGeneration || gameStatus !== 'playing' || !isAITurn() || linesLeft <= 0) return; // partida distinta, terminada, o el turno ya se resolvió solo
  const move = chooseAIMove();
  if (!move) return;
  attemptConnect(move[0], move[1]);
  setTimeout(() => {
    if (generation === gameGeneration && gameStatus === 'playing' && isAITurn() && linesLeft > 0) runAIMoves(generation);
  }, 1100); // más pausado entre líneas — con varias seguidas antes no daba tiempo a ver dónde había trazado cada una
}

function showBlockedMessage(remaining) {
  vibrate(HAPTIC.dismiss);
  const p = players[currentPlayer];
  const color = playerColor(currentPlayer) || '#fff';
  const el = document.getElementById('turnInfo');
  el.innerHTML = `<span style="color:${color}">${escapeHtml(p.name)}</span> — sin movimientos posibles, pierde ${remaining} línea${remaining !== 1 ? 's' : ''}`;
  setSelectedCircle(null);
}

function endGame() {
  gameStatus = 'finished';
  vibrate(HAPTIC.celebrate);
  document.getElementById('modalTitle').textContent = '¡Fin del juego!';
  // Tabla de resultados
  const sorted = [...players].map((p,i) => ({...p, idx:i})).sort((a,b) => b.score - a.score);
  let body = sorted.map(p => {
    const color = playerColor(p.idx);
    return `<span style="color:${color};font-weight:700">${escapeHtml(p.name)}</span>: ${p.score} triángulo${p.score!==1?'s':''}`;
  }).join('&nbsp; · &nbsp;');
  body += '<br><br>';
  const maxScore = sorted[0].score;
  const winners = sorted.filter(p => p.score === maxScore);
  let resultLine;
  if (winners.length > 1) {
    resultLine = `🤝 ¡Empate entre ${winners.map(p=>p.name).join(' y ')}!`;
    body += `🤝 ¡Empate entre ${winners.map(p=>`<strong>${escapeHtml(p.name)}</strong>`).join(' y ')}!`;
  } else {
    resultLine = `🏆 ¡Gana ${winners[0].name}!`;
    body += `🏆 ¡Gana <strong style="color:${playerColor(winners[0].idx)}">${escapeHtml(winners[0].name)}</strong>!`;
  }
  document.getElementById('modalBody').innerHTML = body;
  openDialog('modalOverlay');

  lastResultText = buildShareText(sorted, resultLine);
  launchConfetti(winners.length === 1 ? playerColor(winners[0].idx) : null);
}

let lastResultText = '';

function buildShareText(sorted, resultLine) {
  const scores = sorted.map(p => `${p.name}: ${p.score}`).join(' · ');
  const url = window.location.href.split('?')[0].split('#')[0];
  return [`⬤ Juego de Círculos`, scores, resultLine, '', '¿Te animas a jugar?', url].join('\n');
}

async function shareResult() {
  vibrate(HAPTIC.select);
  const btn = document.getElementById('shareBtn');
  const originalLabel = btn.textContent;

  if (navigator.share) {
    try {
      await navigator.share({ text: lastResultText });
      return;
    } catch (err) {
      if (err?.name === 'AbortError') return; // el usuario canceló, no insistimos
      // cualquier otro fallo cae al portapapeles
    }
  }
  try {
    await navigator.clipboard.writeText(lastResultText);
    btn.textContent = '¡Copiado!';
    setTimeout(() => { btn.textContent = originalLabel; }, 2200);
  } catch { /* sin portapapeles disponible; no hay fallback razonable más */ }
}

// ── Confeti (mismo patrón CSS que elige-tu-pan-quiz, sin librería) ──────────
function launchConfetti(highlightColor) {
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;

  const palette = highlightColor ? [highlightColor, ...PLAYER_COLORS] : PLAYER_COLORS;
  const layer = document.createElement('div');

  for (let i = 0; i < 60; i++) {

    piece.style.left = `${Math.random() * 100}%`;
    piece.style.width = `${size}px`;
    piece.style.height = `${size * 0.4}px`;

// ── Dibujo ────────────────────────────────────────────────────────────────────
// El canvas se pinta con la API de Canvas, no con CSS — los colores no
// heredan las variables del tema solos. Este helper elige uno u otro según
// el tema activo; sin esto, los tonos "blanco translúcido" pensados para
// fondo oscuro se vuelven invisibles sobre el tablero blanco del tema claro
// (el bug de "los enlaces posibles desaparecen en claro").
function canvasColor(darkValue, lightValue) {
  return document.documentElement.getAttribute('data-theme') === 'light' ? lightValue : darkValue;
}

// Los nombres de jugador los escribe la propia persona jugando — sin
// escapar esto, un nombre como "<img src=x onerror=...>" se ejecutaría en
// la pantalla de cualquiera que esté mirando la partida. Mismo patrón que
// en pwa-template/core/escapeHtml.js.
function escapeHtml(value) {
  if (value == null) return '';
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

// ── Tamaño del tablero ───────────────────────────────────────────────────────
// No solo el ancho disponible: en móviles altos y estrechos, el ancho suele
// ser el factor limitante aunque sobre alto de pantalla. Usar también el
// alto disponible deja el tablero notablemente más grande ahí, que es donde
// más se notaba "justo para jugar".
function boardDimensions(wrap) {
  wrap.style.width = '';
  wrap.style.height = ''; // vuelve al 100% natural del CSS antes de medir
  const naturalWidth = wrap.clientWidth;

  // Antes esto era un porcentaje fijo del alto de pantalla, que no tenía
  // en cuenta cuánto ocupaban de verdad las tarjetas/turno/botones de
  // encima — en pantallas más pequeñas o con letra más grande, algo
  // acababa fuera de la parte visible. Midiendo dónde empieza el tablero
  // de verdad (que ya incluye todo lo que hay antes: cabecera compacta,
  // tarjetas, fila de acciones, aviso de turno, y los huecos entre todo
  // eso) el tablero nunca deja nada más fuera de pantalla.
  const wrapTop = wrap.getBoundingClientRect().top;
  const bottomReserve = 76; // botones flotantes de tema/info + su margen
  const availableHeight = window.innerHeight - wrapTop - bottomReserve;

  return {
    width: Math.round(Math.min(naturalWidth, 960)),
    height: Math.round(Math.min(Math.max(availableHeight, 160), 960))
  };
}

// El canvas por defecto tiene el mismo número de píxeles de buffer que su
// tamaño en CSS — en una pantalla con devicePixelRatio 2 o 3 (la mayoría de
// móviles), eso se ve borroso. Se guarda W/H como coordenadas LÓGICAS (sin
// tocar el resto del juego, que sigue razonando en esas coordenadas) y se
// escala solo el buffer real + una transformación, para que se vea nítido
// sin cambiar ninguna otra cuenta geométrica.
function applyCanvasSize(width, height) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Triángulos rellenos
  triangles.forEach(t => {
    const ca = circles[t.a], cb = circles[t.b], cc = circles[t.c];
    ctx.beginPath();
    ctx.moveTo(ca.x, ca.y);
    ctx.lineTo(cb.x, cb.y);
    ctx.lineTo(cc.x, cc.y);
    ctx.closePath();
    ctx.fillStyle = playerLightColor(t.owner) || 'rgba(255,255,255,0.1)';
    ctx.fill();

    // Inicial del jugador centrada
    const cx = (ca.x + cb.x + cc.x) / 3;
    const cy = (ca.y + cb.y + cc.y) / 3;
    ctx.font = 'bold 14px Nunito, sans-serif';
    ctx.fillStyle = playerColor(t.owner) || '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(players[t.owner].initial, cx, cy);
  });

  // Líneas existentes
  edges.forEach(key => {
    const [i, j] = key.split('-').map(Number);
    if (key === lastAIEdgeKey) {
      // Resaltada: la que acaba de trazar la máquina — más gruesa, con su
      // color, y un halo suave para que salte a la vista de verdad.
      ctx.save();
      ctx.shadowColor = lastAIEdgeColor || '#ffffff';
      ctx.shadowBlur = 10;
      drawLine(circles[i], circles[j], lastAIEdgeColor || canvasColor('#ffffff', '#1a1f2e'), 4);
      ctx.restore();
    } else {
      drawLine(circles[i], circles[j], canvasColor('rgba(255,255,255,0.18)', 'rgba(26,31,46,0.22)'), 2);
    }
  });

  // Línea provisional: desde seleccionado hasta cursor (no implementada — se dibuja abajo)

  // Líneas adyacentes posibles del seleccionado (hint visual)
  if (selectedCircle !== null && linesLeft > 0 && selectedTargetsCache) {
    const sc = circles[selectedCircle];
    selectedTargetsCache.forEach(i => {
      drawLine(sc, circles[i], canvasColor('rgba(255,255,255,0.07)', 'rgba(26,31,46,0.15)'), 1.5);
    });
  }

  // Calcular círculos con movimientos válidos (para apagar los bloqueados)
  const activeCircles = diceRolled ? computeActiveCircles() : null;

  // Círculos
  circles.forEach((c, i) => {
    const isSelected = i === selectedCircle;
    const isAdj = selectedTargetsCache ? selectedTargetsCache.has(i) : false;
    const isBlocked = activeCircles !== null && !activeCircles.has(i);

    ctx.beginPath();
    ctx.arc(c.x, c.y, CIRCLE_R, 0, Math.PI * 2);

    if (isSelected) {
      const pc = playerColor(currentPlayer) || '#ffffff';
      ctx.fillStyle = pc + '80';
      ctx.strokeStyle = pc;
      ctx.lineWidth = 3;
    } else if (isAdj && linesLeft > 0) {
      ctx.fillStyle = canvasColor('rgba(255,255,255,0.12)', 'rgba(26,31,46,0.07)');
      ctx.strokeStyle = canvasColor('rgba(255,255,255,0.4)', 'rgba(26,31,46,0.4)');
      ctx.lineWidth = 2;
    } else if (isBlocked) {
      // Sin movimientos posibles: muy apagado
      ctx.fillStyle = canvasColor('#1e2235', '#eef0f5');
      ctx.strokeStyle = canvasColor('#2a3048', '#dde1ea');
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.45;
    } else {
      ctx.fillStyle = canvasColor('#2e364a', '#d7dbe6');
      ctx.strokeStyle = canvasColor('#4a5370', '#b8bfd0');
      ctx.lineWidth = 2;
    }
    ctx.fill();
    ctx.stroke();
    ctx.globalAlpha = 1; // restaurar siempre

    // Número de índice — solo con ?debug en la URL. Muy útil para reportar
    // "el 7 no conecta con el 12" en vez de describir posiciones en una
    // captura, pero no es parte del diseño normal del juego.
    if (DEBUG) {
      ctx.font = `700 ${Math.max(8, Math.round(CIRCLE_R * 0.85))}px 'Nunito', sans-serif`;
      ctx.fillStyle = canvasColor('rgba(255,255,255,0.85)', 'rgba(26,31,46,0.8)');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i), c.x, c.y);
    }
  });

  // Línea "de goma" mientras se arrastra desde el círculo de origen —
  // roja si el destino actual no sería válido, para explicarlo ANTES de
  // soltar, no solo después.
  if (traceGesture.moved && traceGesture.origin >= 0) {
    const origin = circles[traceGesture.origin];
    let lineColor = playerColor(currentPlayer) || '#ffffff';
    if (traceGesture.hoverValid === false) lineColor = canvasColor('#e8836a', '#9c3b26');
    ctx.save();
    ctx.setLineDash([6, 5]);
    drawLine(origin, { x: traceGesture.curX, y: traceGesture.curY }, lineColor, 2.5);
    ctx.restore();
  }
}

function drawLine(a, b, color, width) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

// ── Utilidades ────────────────────────────────────────────────────────────────
// dist()/distSq() ahora vienen de src/game/geometry.js (cargado antes que

// Margen de tolerancia para comparaciones de coma flotante contra
