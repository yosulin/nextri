name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # ejecución completa a mano desde la pestaña Actions
  schedule:
    - cron: '0 3 * * *'  # nocturno: simulaciones largas

jobs:
  # Rápido, en cada push: sintaxis + coherencia + pruebas deterministas.
  # Estas no dependen del tamaño de muestra, así que se corren enteras.
  comprobaciones:
    name: Sintaxis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis, precaché y versiones
        run: node scripts/check-syntax.cjs

      - name: Referencias entre módulos
        run: node scripts/check-modules.cjs

      - name: Estado serializable (ida y vuelta)
        run: node scripts/test-state.cjs

      - name: Guardar / continuar partida
        run: node scripts/test-storage.cjs

      - name: Determinismo con semilla
        run: node scripts/test-random.cjs

      - name: Motor puro (applyAction)
        run: node scripts/test-engine.cjs

      - name: Agregaciones de estadísticas
        run: node scripts/test-stats.cjs

      - name: Radar de perfiles de rival
        run: node scripts/test-radar.cjs

      - name: Invitado semanal y desbloqueo
        run: node scripts/test-invitados.cjs

      - name: Generación de tableros (invariantes y calidad)
        run: node scripts/test-board-gen.cjs 40

  # Simulaciones estadísticas. En push/PR van reducidas para no eternizar
  # cada commit; enteras por la noche y cuando se lanzan a mano.
  simulaciones:
    name: Simulaciones del motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Elegir tamaño de muestra
        id: muestra
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "runs=60"      >> "$GITHUB_OUTPUT"
            echo "scenarios=40" >> "$GITHUB_OUTPUT"
          else
            echo "runs=250"      >> "$GITHUB_OUTPUT"
            echo "scenarios=120" >> "$GITHUB_OUTPUT"
          fi

      - name: Generación de tableros y calibración de adyacencia
        env:
          RUNS_PER_SIZE: ${{ steps.muestra.outputs.runs }}
        run: node scripts/simulate-adjacency.cjs

      # Con menos de 120 escenarios, averageGain no es concluyente y el
      # propio script lo trata como aviso en vez de fallo (ver el comentario
      # allí). giftRate y "cero movimientos ilegales" sí son estrictos
      # también en la versión reducida.
      - name: Niveles de Circuit (Fácil / Medio / Difícil)
        env:
          SCENARIOS: ${{ steps.muestra.outputs.scenarios }}
        run: node scripts/simulate-ai.cjs

  # Prueba de humo en un navegador real. Es el hueco que dejó pasar tres
  # fallos que solo aparecían al abrir el juego: todo lo demás corre en
  # Node, que no carga index.html ni tiene DOM.
  navegador:
    name: Prueba de humo en navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright y servidor estático
        run: |
          npm install --no-save @playwright/test http-server
          npx playwright install --with-deps chromium

      - name: Cargar la app real y jugar una partida
        run: npx playwright test --config=playwright.config.mjs
