<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de marca NEXTRI: la letra N construida con nodos y líneas,
       que es literalmente el juego (unir círculos, cerrar triángulos).
       La diagonal va recta de arriba-izquierda a abajo-derecha, como en
       una N real; la versión anterior subía y bajaba y se leía más como
       un triángulo que como una letra. Los dos triángulos tenues que
       quedan a los lados de la diagonal mantienen el guiño al juego. -->
  <rect width="512" height="512" rx="114" fill="#0f1729"/>

  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
    <!-- Las dos mitades que la diagonal deja a cada lado -->
    <polygon points="120,120 392,392 120,392" fill="#2f7ef0" opacity="0.13"/>
    <polygon points="120,120 392,120 392,392" fill="#ff8c32" opacity="0.10"/>

    <g stroke-linecap="round" fill="none" stroke-width="32">
      <!-- Asta izquierda -->
      <line x1="120" y1="120" x2="120" y2="392" stroke="#2f7ef0"/>
      <!-- Diagonal: de arriba-izquierda a abajo-derecha -->
      <line x1="120" y1="120" x2="392" y2="392" stroke="#2f7ef0"/>
      <!-- Asta derecha, en el naranja de acento -->
      <line x1="392" y1="120" x2="392" y2="392" stroke="#ff8c32"/>
    </g>

    <!-- Nodos: los círculos del juego, en los vértices de la letra -->
    <circle cx="120" cy="120" r="36" fill="#5b9df8"/>
    <circle cx="120" cy="392" r="32" fill="#2f7ef0"/>
    <circle cx="392" cy="120" r="36" fill="#ff8c32"/>
    <circle cx="392" cy="392" r="32" fill="#2f7ef0"/>
    <!-- Nodo central sobre la diagonal: refuerza que está hecha de conexiones -->
    <circle cx="256" cy="256" r="26" fill="#5b9df8"/>
  </g>
</svg>
